<!DOCTYPE html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <title>待辦事項 — Minimal Warm</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf3e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1d160f" media="(prefers-color-scheme: dark)" />
    <meta name="format-detection" content="telephone=no" />

    <!-- iOS Add-to-Home-Screen -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="待辦" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- PWA manifest is injected by vite-plugin-pwa -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Huninn 手寫體：自行託管的子集化 woff2（ASCII + Big5 常用字，約 1.1MB，
         原 CDN 完整 TTF 約 4.5MB）。罕見字 fallback 到 Noto Sans TC / 系統字型。 -->
    <link rel="preload" href="/fonts/jf-openhuninn-2.0-subset.woff2" as="font" type="font/woff2" crossorigin />
    <style>
      @font-face {
        font-family: 'Huninn';
        font-style: normal;
        font-weight: 400;
        font-display: swap;
        src: url('/fonts/jf-openhuninn-2.0-subset.woff2') format('woff2');
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
